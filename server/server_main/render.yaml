services:
  - type: web
    name: ecocharge-api
    runtime: node
    rootDir: server/server_main
    # Install ALL deps (including devDeps for prisma CLI), generate client, compile TS
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # Apply any unapplied migrations before the new instance starts
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # ── Database ────────────────────────────────────────────────────────────
      # Set this in the Render dashboard.
      # Format: mysql://user:pass@host:port/db?ssl-ca=certs/ca.pem
      # The certs/ca.pem file is committed to the repo (downloaded from Aiven console).
      - key: DATABASE_URL
        sync: false
      # ── JWT ─────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "60m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"
      # ── Device ──────────────────────────────────────────────────────────────
      - key: DEVICE_API_KEY
        sync: false
      # ── AI Server ───────────────────────────────────────────────────────────
      - key: AI_SERVER_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      # ── Supabase ────────────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: ecocharge_bucket

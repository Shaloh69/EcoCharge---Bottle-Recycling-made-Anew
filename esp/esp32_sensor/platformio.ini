; EcoCharge — ESP32-B "Sensor Node"
;
; Reads the voltage + current sensors for charging ports 3 and 4 and streams
; them to ESP32-A over UART2. Replaces the Raspberry Pi Pico co-processor that
; filled this role before hardware rev 3.0.0 (2026-08-20).
;
; WiFi is never initialised on this board. That is the whole point: with the
; radio off, ADC2 would also be usable, but all four channels fit on ADC1
; anyway — so nothing here depends on a shared/contended peripheral.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
build_type = release
monitor_speed = 115200

build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO

; EcoCharge Kiosk Controller — PlatformIO Project Configuration
; Target: ESP32 dev board (esp32dev)
; Framework: ESP-IDF
; Build: release (optimize for production)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
build_type = release
monitor_speed = 115200

; Use huge_app partition scheme: ~3 MB app + NVS + PHY
; Requires 4 MB flash chip (standard on all ESP32 dev boards)
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB

; ESP-IDF components required for HTTP client, TLS, WiFi, ADC
board_build.cmake_extra_args =
    -DCONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY=y

build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO

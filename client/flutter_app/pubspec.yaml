name: flutter_app
description: "EcoCharge - Recycle bottles. Earn charging credits."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  mobile_scanner: ^6.0.5
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

  # "Clean Energy Reward" animation stack — docs/planning/02-design-mandate.md
  # SS5. Confirmed absent as of 2026-08-10 (checked pubspec.yaml directly);
  # this is genuinely new, not a version bump.
  google_fonts: ^6.2.1       # Baloo 2 (display) + IBM Plex Sans (body) + IBM Plex Mono (numerals) - same families as client/kiosk_web and client/web
  skeletonizer: ^2.1.3       # loading skeletons - dimensions must match final layout, no layout jump
    # ^ was pinned ^1.4.2 - real, found 2026-08-11: 1.4.x's Canvas subclasses
    # don't implement the installed Flutter SDK's newer Canvas.drawRSuperellipse
    # method, so any real Skeletonizer usage fails to compile (`flutter build
    # web`, dart2js). Latent until this session actually wired a Skeletonizer
    # widget in for the first time - nothing had ever triggered it before.
  lottie: ^3.1.3             # decorative: splash, empty states, success/failure
  rive: ^0.13.20             # state-driven: live charging countdown + port-status ring
  flutter_animate: ^4.5.2    # list/card entrance transitions
  cached_network_image: ^3.4.1  # avatars, any bottle-photo display

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
